<style>

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>
const $=s=>document.querySelector(s),h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),TL=n=>(+n||0).toLocaleString('tr-TR')+' ₺';
const DEF=[['Sıcak İçecekler','Türk Kahvesi',85,'Közde pişmiş, yanında lokum'],['Sıcak İçecekler','Filtre Kahve',95,'Günün çekirdeği, taze demleme'],['Sıcak İçecekler','Latte',120,'Çift shot espresso, ipeksi süt'],['Sıcak İçecekler','Sıcak Çikolata',115,'Bitter çikolata, krema'],['Soğuk İçecekler','Cold Brew',125,'18 saat soğuk demlenmiş'],['Soğuk İçecekler','Ev Yapımı Limonata',100,'Nane ve taze limon'],['Tatlılar','San Sebastian',165,'Akışkan ortası, çıtır kenarı'],['Tatlılar','Fıstıklı Baklava',180,'Dört dilim, Antep fıstığı'],['Atıştırmalıklar','Avokadolu Tost',190,'Ekşi maya, poşe yumurta'],['Atıştırmalıklar','Peynirli Börek',130,'El açması, sıcak servis']].map((a,i)=>({id:'d'+i,cat:a[0],name:a[1],price:a[2],desc:a[3],on:true,o:i}));
const DI={name:'Lale Kahve',about:'Mahallenin yavaş kahvesi. Her fincan sipariş üzerine hazırlanır.',hours:'Her gün 08.00–23.00',addr:'Bağdat Caddesi No: 12, Kadıköy',tel:'0216 555 01 23',wifi:'lalekahve2026',tables:10,url:''};
const ST={new:'Yeni',prep:'Hazırlanıyor',done:'Teslim edildi',paid:'Ödendi'},NX={new:['prep','Hazırlamaya başla'],prep:['done','Teslim edildi'],done:['paid','Ödeme alındı']};
let db=null,user=null,assets=null,auth=null,unsubO=null,booting=true,L={menu:{},cafe:{},orders:{}},got={},cart={},note='',sheet=0,sent=0,tab='urun',fil='act',seen=null,seeding=0,E=null,pick=0;
const KEY='lale-demo';try{const v=JSON.parse(localStorage.getItem(KEY));if(v)L=v}catch(e){}
const info=()=>({...DI,...(L.cafe.info||{})}),seeded=()=>!!(L.cafe.info&&L.cafe.info.seeded);
const items=()=>{const a=Object.values(L.menu);return(a.length||seeded()?a:DEF).slice().sort((x,y)=>x.o-y.o)};
const canManage=()=>!db||!!(user&&user.canEdit());
const route=()=>{const m=location.hash.slice(1);if(m==='kasa'||m==='admin')return{v:m};const t=/^masa-(\d{1,3})$/.exec(m);return{v:'menu',t:t?+t[1]:0}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
function persist(){if(!db)try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
async function put(c,id,d,msg){L[c][id]=d;persist();render();if(db)try{await db.collection(c).doc(id).set(d)}catch(e){toast(msg||'Kaydedilemedi. Yetkinizi kontrol edin.');return false}return true}
async function del(c,id){delete L[c][id];persist();render();if(db)try{await db.collection(c).doc(id).delete()}catch(e){toast('Silinemedi.')}}
let AC=null,sndOn=false,wl=null;
function chime(){if(!sndOn||!AC)return;try{if(AC.state==='suspended')AC.resume();[[988,0],[784,.28],[988,.56],[1319,.84]].forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.7,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.45);o.start(s);o.stop(s+.5)})}catch(e){}}
async function setSnd(on){sndOn=on;if(on){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();await AC.resume()}catch(e){}chime();try{wl=await navigator.wakeLock.request('screen')}catch(e){}}else{try{wl&&wl.release()}catch(e){}wl=null}render()}
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&sndOn){try{if(AC)await AC.resume();wl=await navigator.wakeLock.request('screen')}catch(e){}}});
setInterval(()=>{if(sndOn&&unlocked&&route().v==='kasa'&&Object.values(L.orders).some(o=>o.st==='new'))chime()},6000);
function sub(c){try{return db.collection(c).onSnapshot(s=>{L[c]=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));got[c]=1;if(c==='orders'){const n=new Set(Object.keys(L.orders).filter(k=>L.orders[k].st==='new'));if(seen&&[...n].some(i=>!seen.has(i)))chime();seen=n}render()},()=>{got[c]=1;render()})}catch(e){got[c]=1}}
function seed(){if(!db||!canManage()||!got.menu||!got.cafe||seeded()||Object.keys(L.menu).length||seeding)return;seeding=1;DEF.forEach(d=>put('menu',d.id,d));put('cafe','info',{...DI,seeded:true})}
function init(){
 try{if(!window.FB_CONFIG||!FB_CONFIG.apiKey||/BURAYA/.test(FB_CONFIG.apiKey))throw 0;firebase.initializeApp(FB_CONFIG);db=firebase.firestore();auth=firebase.auth()}catch(e){db=null}
 if(db){
  unlocked=false;L={menu:{},cafe:{},orders:{}};sub('menu');sub('cafe');
  auth.onAuthStateChanged(u=>{booting=false;user=u?{canEdit:()=>true}:null;unlocked=!!u;if(unsubO){unsubO();unsubO=null}
   if(u){seen=null;unsubO=sub('orders')}else L.orders={};render()})
 }else{booting=false;if(!L.cafe.info){L.menu=Object.fromEntries(DEF.map(d=>[d.id,d]));L.cafe.info={seeded:true};persist()}render()}}
const vItem=(x,t)=>{const q=cart[x.id]||0;return`<article class="it"><div><h3>${h(x.name)}</h3><p>${h(x.desc)}</p><div class="pr"><b>${TL(x.price)}</b>${t?(q?`<span class="q"><button data-a="dec" data-id="${x.id}" aria-label="Azalt">−</button><span>${q}</span><button data-a="inc" data-id="${x.id}" aria-label="Artır">+</button></span>`:`<button class="btn" data-a="inc" data-id="${x.id}">Ekle</button>`):''}</div></div>${x.img?`<img src="${h(x.img)}" alt="${h(x.name)}">`:''}</article>`};
function vMenu(t){
 const I=info(),its=items().filter(i=>i.on!==false),cats=[...new Set(its.map(i=>i.cat))];
 const n=Object.values(cart).reduce((a,b)=>a+b,0),tot=its.reduce((a,i)=>a+(cart[i.id]||0)*i.price,0);
 return`<header class="hero"><div class="wrap">${t?`<span class="tb">Masa ${t}</span>`:''}<h1>${h(I.name)}</h1><p>${h(I.about)}</p><div class="inf"><span>${h(I.hours)}</span><span>${h(I.addr)}</span><span>${h(I.tel)}</span>${I.wifi?`<span>Wi‑Fi şifresi: ${h(I.wifi)}</span>`:''}</div></div></header>
<nav class="cats">${cats.map((c,i)=>`<button data-a="go" data-i="${i}">${h(c)}</button>`).join('')}</nav>
<main class="wrap">${cats.map((c,i)=>`<section id="c${i}"><h2>${h(c)}</h2>${its.filter(x=>x.cat===c).map(x=>vItem(x,t)).join('')}</section>`).join('')||'<p class="msg">Menü henüz hazır değil.</p>'}</main>
${t&&n?`<button class="cb" data-a="cart"><span>${n} ürün</span><b>Sepeti gör, ${TL(tot)}</b></button>`:''}`}
function vSheet(){
 if(sent)return`<div class="ov"><div class="sh"><h2>Siparişiniz alındı</h2><p>Siparişiniz kasaya iletildi. Kısa süre içinde masanıza getireceğiz.</p><button class="btn big" data-a="close">Menüye dön</button></div></div>`;
 if(!sheet)return'';
 const its=items().filter(i=>cart[i.id]),tot=its.reduce((a,i)=>a+cart[i.id]*i.price,0);
 return`<div class="ov" data-a="bg"><div class="sh"><h2>Sepetim</h2>${its.map(x=>`<div class="ln"><span>${h(x.name)}<small>${TL(x.price)}</small></span><span class="q"><button data-a="dec" data-id="${x.id}" aria-label="Azalt">−</button><span>${cart[x.id]}</span><button data-a="inc" data-id="${x.id}" aria-label="Artır">+</button></span></div>`).join('')}<textarea id="note" rows="2" placeholder="Sipariş notu (isteğe bağlı)">${h(note)}</textarea><button class="btn big" data-a="send">Siparişi gönder, ${TL(tot)}</button></div></div>`}
async function send(){
 const t=route().t,its=items().filter(i=>cart[i.id]);if(!its.length||!t)return;
 const o={t,st:'new',ts:Date.now(),note:note.trim(),tot:its.reduce((a,i)=>a+cart[i.id]*i.price,0),l:its.map(i=>({n:i.name,p:i.price,q:cart[i.id]}))};
 if(await put('orders','o'+Date.now()+Math.random().toString(36).slice(2,5),o,'Sipariş gönderilemedi. Lütfen personele haber verin.')){cart={};note='';sheet=0;sent=1;render()}}
const PW='084ab3a3dee59fdcd30bfb23c597bde17c040e06dd0f5af8322d1b2f6b17f4bc';let unlocked=false;try{unlocked=sessionStorage.getItem('unl')==='1'}catch(e){}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const vLock=()=>`<div class="lock"><h2>Giriş</h2><p>Kasa ve yönetim için giriş yapın.</p>${db?'<input id="em" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="E-posta">':''}<input id="pw" type="password" autocomplete="current-password" placeholder="Şifre"><label class="sw" style="justify-content:center;margin:-6px 0 14px"><input type="checkbox" data-a="shw">Şifreyi göster</label><button class="btn big" data-a="unlock">Giriş yap</button><p id="pwe" class="err" role="alert"></p></div>`;
const PWF=`<label class="fl">Giriş şifresini değiştir<input type="password" autocomplete="new-password" placeholder="Yeni şifre" data-f="pw"></label>`;
const authMsg=e=>{const c=(e&&e.code)||'';return /invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(c)?'E-posta veya şifre yanlış.':/operation-not-allowed/.test(c)?'Firebase’de Email/Password girişi açık değil.':/api-key/.test(c)?'API anahtarı geçersiz, firebase-config.js dosyasını kontrol edin.':/network/.test(c)?'Bağlantı kurulamadı, interneti kontrol edin.':'Giriş yapılamadı ('+c+').'};
async function unlock(){const v=$('#pw').value;if(db){try{await auth.signInWithEmailAndPassword($('#em').value.trim(),v)}catch(e){$('#pwe').textContent=authMsg(e)}return}if(await sha(v)===(info().pw||PW)){unlocked=true;try{sessionStorage.setItem('unl','1')}catch(e){}render()}else $('#pwe').textContent='Şifre yanlış.'}
const nav=c=>`<div class="top"><b class="lg">${c}</b><span class="row"><a href="#kasa" class="${c==='Kasa'?'on':''}">Kasa</a><a href="#admin" class="${c==='Yönetim'?'on':''}">Yönetim</a>${db?'<button class="ghost" data-a="out">Çıkış</button>':''}</span></div>`;
const ago=ts=>{const m=Math.round((Date.now()-ts)/6e4);return m<1?'şimdi':m+' dk önce'};
function vKasa(){
 const all=Object.entries(L.orders).map(([id,o])=>({id,...o})).sort((a,b)=>b.ts-a.ts),act=all.filter(o=>o.st!=='paid'),paid=all.filter(o=>o.st==='paid'),d=new Date().toDateString();
 const sum=paid.filter(o=>new Date(o.ts).toDateString()===d).reduce((a,o)=>a+o.tot,0),list=fil==='act'?act:paid;
 return nav('Kasa')+`<div class="adm">${sndOn?'':'<button class="btn big" data-a="snd" style="margin-bottom:12px">Sipariş sesini aç</button>'}<div class="row"><button class="chip ${fil==='act'?'on':''}" data-a="fil" data-v="act">Aktif (${act.length})</button><button class="chip ${fil==='paid'?'on':''}" data-a="fil" data-v="paid">Ödenenler</button>${sndOn?'<button class="chip on" data-a="snd">Ses açık</button>':''}<span class="sp">Bugün: <b>${TL(sum)}</b></span></div>${list.map(o=>`<div class="card ${o.st==='new'?'new':''}"><div class="row"><b class="big">Masa ${o.t}</b><span class="tag">${ST[o.st]}</span><span class="sp">${ago(o.ts)}</span></div><ul>${o.l.map(x=>`<li>${x.q} × ${h(x.n)}</li>`).join('')}</ul>${o.note?`<p class="nt">Not: ${h(o.note)}</p>`:''}<div class="row"><b>${TL(o.tot)}</b>${o.st==='paid'?'':`<button class="ghost sp" data-a="cancel" data-id="${o.id}">İptal et</button>`}${NX[o.st]?`<button class="btn ${o.st==='paid'?'sp':''}" data-a="adv" data-id="${o.id}">${NX[o.st][1]}</button>`:''}</div></div>`).join('')||`<p class="msg">${fil==='act'?'Bekleyen sipariş yok.':'Henüz ödenen sipariş yok.'}</p>`}</div>`}
function vAdmin(){
 const I=info(),f=(k,l,t='text')=>`<label class="fl">${l}<input type="${t}" value="${h(I[k])}" data-k="${k}"></label>`;let b;
 if(tab==='urun')b=`<button class="btn" data-a="edit" data-id="">Yeni ürün ekle</button>`+items().map(x=>`<div class="card row"><div class="th">${x.img?`<img src="${h(x.img)}" alt="">`:''}</div><div class="gr"><b>${h(x.name)}</b><br><small>${h(x.cat)}</small></div><input class="pi" type="number" min="0" value="${x.price}" data-f="price" data-id="${x.id}" aria-label="Fiyat"><label class="sw"><input type="checkbox" data-f="on" data-id="${x.id}" ${x.on!==false?'checked':''}>Satışta</label><button class="ghost" data-a="edit" data-id="${x.id}">Düzenle</button><button class="ghost" data-a="rm" data-id="${x.id}">Sil</button></div>`).join('');
 else if(tab==='bilgi')b=f('name','Kafe adı')+`<label class="fl">Hakkında<textarea rows="3" data-k="about">${h(I.about)}</textarea></label>`+f('hours','Çalışma saatleri')+f('addr','Adres')+f('tel','Telefon')+f('wifi','Wi‑Fi şifresi');
 else b=f('url','Site adresi (paylaştığınız bağlantıyı yapıştırın)')+f('tables','Masa sayısı','number')+`<button class="btn" data-a="print">QR kodlarını yazdır</button><div class="qrs">${Array.from({length:Math.min(60,+I.tables||1)},(_,i)=>`<div class="qc"><div data-q="${i+1}"></div><a href="#masa-${i+1}">Masa ${i+1}</a></div>`).join('')}</div>`;
 return nav('Yönetim')+`<div class="adm"><div class="row">${[['urun','Ürünler'],['bilgi','Kafe bilgisi'],['qr','Masa QR kodları']].map(([k,l])=>`<button class="chip ${tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</div>${b}${tab==='bilgi'&&!db?PWF:''}</div>`}
function drawQR(){if(!window.QRCode)return;const base=(info().url||location.href).split('#')[0];document.querySelectorAll('[data-q]').forEach(e=>{e.innerHTML='';new QRCode(e,{text:base+'#masa-'+e.dataset.q,width:132,height:132,colorDark:'#1C2A23',colorLight:'#ffffff'})})}
function render(){
 if(!unlocked&&document.activeElement&&document.activeElement.id==='pw')return;const r=route(),y=scrollY,live=db&&!(got.menu&&got.cafe);let b;
 if(r.v==='menu')b=vMenu(r.t);
 else b=booting||live?'<p class="msg">Yükleniyor…</p>':!unlocked?vLock():r.v==='kasa'?vKasa():vAdmin();
 $('#app').innerHTML=(!booting&&!db?'<div class="demo">Demo modu: veriler paylaşılan bir veritabanına bağlı değil, yalnızca bu cihazda saklanır.</div>':'')+b;
 $('#modal').innerHTML=r.v==='menu'?vSheet():'';scrollTo(0,y);
 if(r.v==='admin'&&tab==='qr'&&canManage()&&unlocked)drawQR();seed();const nn=unlocked?Object.values(L.orders).filter(o=>o.st==='new').length:0;document.title=nn?'('+nn+') Yeni sipariş':info().name}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,420/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.78)};i.src=URL.createObjectURL(f)});
async function photo(f){const b=await shrink(f);if(assets)try{return(await assets.upload(b)).url}catch(e){}return new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(b)})}
const grab=()=>{const v=s=>$(s).value;E={...E,name:v('#e-n'),price:v('#e-p'),cat:v('#e-c'),desc:v('#e-d')}};
function ed(){$('#ed').innerHTML=E?`<div class="ov"><div class="sh"><h2>${E.name?'Ürünü düzenle':'Yeni ürün'}</h2><label class="fl">Ürün adı<input id="e-n" value="${h(E.name)}"></label><label class="fl">Fiyat (₺)<input id="e-p" type="number" min="0" value="${h(E.price)}"></label><label class="fl">Kategori<input id="e-c" list="cl" value="${h(E.cat)}"></label><datalist id="cl">${[...new Set(items().map(i=>i.cat))].map(c=>`<option value="${h(c)}">`).join('')}</datalist><label class="fl">Açıklama<textarea id="e-d" rows="2">${h(E.desc)}</textarea></label><div class="row" style="margin-bottom:16px">${E.img?`<img class="pv" src="${h(E.img)}" alt="">`:''}<label class="ghost">Fotoğraf seç<input id="e-i" type="file" accept="image/*" hidden></label>${E.img?'<button class="ghost" data-a="rmimg">Kaldır</button>':''}</div><div class="row"><button class="btn" data-a="esave">Kaydet</button><button class="ghost" data-a="eclose">Vazgeç</button></div></div></div>`:''}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,n=$('#note');if(n)note=n.value;
 if(a==='bg'&&e.target!==b)return;
 if(a==='inc'||a==='dec'){cart[id]=Math.max(0,(cart[id]||0)+(a==='inc'?1:-1));if(!cart[id])delete cart[id];if(!Object.keys(cart).length)sheet=0;render()}
 else if(a==='cart'){sheet=1;render()}
 else if(a==='close'||a==='bg'){sheet=0;sent=0;render()}
 else if(a==='go'){document.getElementById('c'+b.dataset.i).scrollIntoView({behavior:'smooth'})}
 else if(a==='send')send();
 else if(a==='unlock')unlock();
 else if(a==='out')auth.signOut();
 else if(a==='snd')setSnd(!sndOn);
 else if(a==='shw')$('#pw').type=b.checked?'text':'password';
 else if(a==='fil'){fil=b.dataset.v;render()}
 else if(a==='tab'){tab=b.dataset.v;render()}
 else if(a==='adv'){const o=L.orders[id];put('orders',id,{...o,st:NX[o.st][0]})}
 else if(a==='cancel'){del('orders',id);toast('Sipariş iptal edildi.')}
 else if(a==='rm'){del('menu',id);toast('Ürün silindi.')}
 else if(a==='edit'){const x=items().find(i=>i.id===id);E=x?{...x}:{id:'p'+Date.now(),name:'',price:'',cat:(items()[0]||{}).cat||'',desc:'',on:true,o:Date.now()};ed()}
 else if(a==='rmimg'){grab();delete E.img;ed()}
 else if(a==='eclose'){E=null;ed()}
 else if(a==='esave'){grab();if(!E.name.trim()||E.price===''||!E.cat.trim())return toast('Ad, fiyat ve kategori gerekli.');await put('menu',E.id,{...E,name:E.name.trim(),cat:E.cat.trim(),price:+E.price});E=null;ed()}
 else if(a==='print'){try{print()}catch(x){toast('Yazdırma açılamadı. QR kodlarının ekran görüntüsünü alabilirsiniz.')}}
});
document.addEventListener('change',async e=>{
 const t=e.target,d=t.dataset;
 if(d.f==='price'&&L.menu[d.id])put('menu',d.id,{...L.menu[d.id],price:Math.max(0,+t.value||0)});
 else if(d.f==='on'&&L.menu[d.id])put('menu',d.id,{...L.menu[d.id],on:t.checked});
 else if(d.f==='pw'){if(t.value.length<4)return toast('Şifre en az 4 karakter olmalı.');put('cafe','info',{...info(),pw:await sha(t.value)});t.value='';toast('Şifre değiştirildi.')}
 else if(d.k)put('cafe','info',{...info(),[d.k]:d.k==='tables'?Math.max(1,Math.min(60,+t.value||1)):t.value});
 else if(t.id==='e-i'&&t.files[0]){grab();toast('Fotoğraf yükleniyor…');E.img=await photo(t.files[0]);ed()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em'))unlock()});document.addEventListener('input',e=>{if(e.target.id==='note')note=e.target.value});
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
setInterval(()=>{if(route().v==='kasa'&&!booting&&canManage()&&unlocked)render()},30000);
render();init();
</script></body></html>
